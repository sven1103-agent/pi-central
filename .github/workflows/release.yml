# Release Pi Central (issue #53).
#
# A release is a single, reviewable act: a tag triggers this, every gate the repository has runs
# first, the artifact is STAGED with a provenance attestation, and a maintainer approves it with 2FA.
# Nothing here is a long-lived credential, and nothing here can publish on its own.
#
# ## Two mechanisms, and the registry-side one is the actual control
#
# **OIDC, not a stored token.** `id-token: write` below lets the runner mint a short-lived OIDC token,
# which npm exchanges for a stage credential under a **trusted publisher** configured on the
# package's npm page. No GitHub Actions secret is referenced anywhere in this workflow, and
# `scripts/release-workflow.test.mjs` fails if one is reintroduced: a stored token is a credential
# that must be rotated, can be exfiltrated by a compromised dependency, and outlives whoever created
# it.
#
# **Stage-only, which is the part that cannot be worked around from here.** The trusted publisher is
# configured so that a direct publish from this workflow is REJECTED by the registry. A workflow that
# merely chose to stage would be decoration: anything able to influence this workflow could publish
# directly instead. Staging is therefore enforced at the registry, and this file is
# the half that cooperates with it rather than the half that provides it. The same applies to
# `latest`: the publisher's *Allow npm dist-tag* permission is off, so CI cannot move it.
#
# `scripts/release-workflow.test.mjs` scans this file as TEXT — for the banned credential AND for a
# direct publish — so those strings cannot appear here even inside a comment. That is why these
# paragraphs describe the rules instead of quoting them, and it is a real cost of a text guard rather
# than a quirk: the checks are broader than the thing they forbid, on purpose, because for "is a
# credential in this file" broader is the correct answer.
#
# `--provenance` attaches a signed attestation linking the tarball to this commit and this workflow
# run, which is the difference between "the maintainer says this is the code" and "this can be
# verified".
#
# ## Why the version is not passed in
#
# The tag must equal `package.json`'s version, and the workflow REFUSES rather than correcting when
# they disagree. A release that helpfully publishes the manifest's version under a different tag is
# how a tag and an artifact start disagreeing about what shipped.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # required to create the GitHub Release
  id-token: write # OIDC: exchanged for a short-lived publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1, and the runner's bundled npm is older. Pinned to no
      # particular version deliberately — the feature is the requirement, not a version number, and
      # a pin here would be a second place to bump for no stated benefit.
      - name: Use a recent npm (trusted publishing needs >= 11.5.1)
        run: npm install --global npm@latest

      - name: Install
        run: npm ci

      # Every gate a pull request ran, run again on the tagged commit. A tag is a claim that this
      # exact tree is good; re-running is what makes the claim true rather than assumed.
      - name: Verify
        run: npm run verify

      # `--release` adds the rule that `## [Unreleased]` is empty: development is allowed to carry
      # unreleased entries, a TAG is not.
      - name: Release checks
        run: node scripts/check-version.mjs --release

      - name: The tag and the manifest must agree
        run: |
          manifest="v$(node -p "require('./package.json').version")"
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json (${manifest}). Refusing to publish: a tag that disagrees with the artifact is how the two start lying about what shipped."
            exit 1
          fi

      - name: Build the artifact
        run: npm run build:package

      # BEFORE the stage, deliberately. This step fails when the version has no CHANGELOG section,
      # and a staged version is not free to discard — generating the notes afterwards would mean a
      # version in the queue with no notes. Nothing about the notes depends on the stage having
      # happened.
      - name: Prepare the release notes from the CHANGELOG
        run: node scripts/release-notes.mjs > release-notes.md

      # STAGE, never publish. This command cannot go live on its own: the trusted publisher is
      # configured stage-only, so a direct publish from this workflow is REJECTED by the registry. That rejection is the control — a command we merely avoided using would be
      # decoration, because anything able to influence this workflow could call it instead.
      #
      # Approval is a human with 2FA, and it can be refused until npm's malware scan finishes. So a
      # release is never the result of a single automated run, and no credential in this repository
      # can ship a version on its own.
      - name: Stage the release with provenance
        run: npm stage publish --provenance --access public

      - name: Say what happens next
        run: |
          echo "::notice::Staged, NOT published. Approve it with 2FA to release it:"
          echo "  npm stage list"
          echo "  npm stage view <stage-id>"
          echo "  npm stage approve <stage-id>    # prompts for 2FA"
          echo "  npm stage reject <stage-id>     # to discard it instead"
          echo "Approval can fail until npm's malware scan completes."
          echo "The GitHub Release below is a DRAFT: publish it only after approving."
          npm stage list || true

      # `gh` rather than a third-party release action: one fewer supply-chain dependency on the path
      # that has write access to the repository's releases, and `gh` is already on the runner.
      #
      # DRAFT, because the version is not installable yet. A Release is a claim that a version
      # exists for people to use, so creating a live one for a staged version would announce
      # something nobody can install — and if the stage is then REJECTED, the Release would have to
      # be withdrawn. The draft carries the notes, so the approver has the material in one place.
      - name: Create a DRAFT GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --draft \
            --verify-tag
