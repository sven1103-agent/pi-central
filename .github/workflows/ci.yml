# CI for Pi Central.
#
# What this can and cannot check is dictated by the product itself, and the split is deliberate.
#
# CHECKED HERE: the unit and component suites, both TypeScript projects, the documentation
# references, and the UI production build. These are the guarantees that must not regress on any
# commit.
#
# NOT CHECKED HERE, AND NOT HIDDEN: anything that spawns a real sandboxed session needs macOS,
# Safehouse, and a plain (non-nested) terminal — Seatbelt does not nest (C1), and a GitHub runner
# has no Safehouse at all (C10). Those checks are `verified/manual` on the issues that need them.
# A CI badge that implied full coverage would be a lie, so this workflow says what it covers.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Typecheck (orchestrator + UI)
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      # A skipped guarantee is invisible: the suite reports success either way. Two tests skip on
      # Linux — the SBPL policy-parse check and its negative control — both needing
      # `sandbox-exec`, which has no Linux implementation (C10). So CI proves the fragment is
      # BUILT correctly but never that it PARSES. That is stated here, on every run, rather than
      # left for someone to discover by reading the suite.
      - name: State what this run does NOT verify
        run: |
          echo "::notice::Not verified on this runner, by design:"
          echo "  - SBPL policy parses (2 tests skip: needs sandbox-exec, macOS only, C10)"
          echo "  - Any real sandboxed session: needs macOS + Safehouse + a non-nested terminal (C1)"
          echo "  - Live Pi RPC round trips against a real session"
          echo "These are 'verified/manual' on the issues that need them. See docs/INCREMENTS.md." 

      - name: Documentation references resolve
        run: npm run check:docs

      - name: UI production build
        run: npm run ui:build

  # The artifact, inspected on every pull request rather than at the moment of a release (#53).
  #
  # `npm publish --dry-run` builds the tarball and prints every file that WOULD ship, so a stray
  # file (a fixture, a transcript, an editor backup) is caught in review instead of after it is on
  # the registry — where it cannot be un-published, only deprecated. It also fails on a `private`
  # manifest or a broken `files` list, which is exactly the class of mistake that is invisible until
  # a release is attempted.
  #
  # It does NOT prove the artifact RUNS. That is #52's `verified/manual` step, and a green dry-run
  # must not be read as more than "the right files are in the box".
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Build the artifact
        run: npm run build:package

      - name: Dry-run the publish, so the tarball is reviewed on the PR
        run: npm publish --dry-run

  # Kept separate so a documentation-only failure is visibly a documentation-only failure.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check:docs
