# Does pi run in a Strands Box on Linux? The one experiment the spike left undone.
#
# RESULT.md ends with this as the open question, because the machine the spike ran on is a Mac in a
# Seatbelt sandbox: box run cannot start ANY workload there (it cannot bind its broker socket), so
# nothing could be observed. A hosted runner has a real kernel, and ubuntu-24.04-arm is the same
# architecture Box's own reference target uses (Amazon Linux 2023 ARM64), so it is the closest thing
# to that target that is available without provisioning hardware.
#
# Deliberately workflow_dispatch only. It installs software and starts a sandbox, so it must never run
# on an ordinary push; and it downloads third-party release binaries, which a spike should do on
# request rather than on every commit.
#
# This is the installed copy. The canonical source is
# spikes/platform-independence/harness/linux-probe.yml -- edit that one and copy it here, so the spike
# keeps a copy that does not require the workflow to exist.
#
#   gh workflow run platform-independence-probe.yml
#   gh run watch
#
# Why this runner and not a local VM: the repository is public, so Actions minutes are not billed, and
# ubuntu-24.04-arm is Box's own reference architecture. A Mac without a Linux desktop can still verify
# the port. See spikes/platform-independence/VERIFYING.md.
#
# Every step reports rather than guessing. A step that cannot run says so and continues, so the job
# ends with a paragraph of facts instead of a red X that means nothing.
name: platform-independence-probe

on:
  # TEMPORARY, REMOVE AFTER THE FIRST RUN. workflow_dispatch requires the workflow to exist on the
  # default branch, so a branch-only spike cannot be dispatched. A push trigger scoped to this one
  # branch is the smallest thing that runs it without merging the whole branch first.
  push:
    branches: [spike/303-platform-independence]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label. ubuntu-24.04-arm is Box's reference architecture."
        required: false
        default: "ubuntu-24.04-arm"

jobs:
  pi-in-a-box:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    steps:
      # The claims step runs the spike's harness scripts, so the repository has to be here. Its
      # absence was a real defect in the first run: three checks reported "No such file" and the job
      # went red for a reason that had nothing to do with the platform.
      - uses: actions/checkout@v4

      - name: Record the environment
        run: |
          echo "== architecture and kernel =="
          uname -m; uname -r
          getconf GNU_LIBC_VERSION || true
          echo "== the whole question, in one line =="
          echo "Can 'pi' start inside a Strands Box on this host?"

      # Box cannot build its cage without unprivileged user namespaces, and Ubuntu 23.10+ gates them
      # behind an AppArmor profile. Hosted runners grant passwordless sudo, so the knob can be cleared
      # for the job. Copied from Box's own CI, where the same step explains itself the same way.
      #
      # Reported, never silently assumed: if the knob is absent or the write is refused, the log says
      # so, because "userns unavailable" and "pi cannot run" are different findings and this spike has
      # already confused two claims once.
      - name: Allow unprivileged user namespaces
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            echo "before: $(cat "$knob")"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
              || echo "WARNING: could not clear the AppArmor userns restriction"
            echo "after:  $(cat "$knob")"
          else
            echo "knob absent -- this kernel does not restrict unprivileged userns"
          fi
          unshare --user --map-root-user true \
            && echo "unshare(CLONE_NEWUSER): OK" \
            || echo "WARNING: unshare(CLONE_NEWUSER) still refused"

      - name: Install Box
        run: |
          cd "$(mktemp -d)"
          curl -fsSL https://raw.githubusercontent.com/strands-agents/box/main/install.sh -o install.sh
          # A hosted runner cannot run the macOS signature check, and this is Linux, which has none.
          sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          box --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # npm, not pi's own installer: the @box/pi pack runs pi's script through node, and says so in its
      # troubleshooting section ("pi from its own installer doesn't run. Install it with npm.").
      - name: Install pi the way the pack requires
        run: |
          node --version
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
          command -v pi
          ls -l "$(command -v pi)"
          pi --version

      # TWO profiles, because the first run answered the wrong question.
      #
      # "pi" is @box/pi alone: no provider route, so no credential is required and the box can
      # actually launch something. This is the profile the measurement below runs under, because the
      # question is whether pi STARTS -- not whether a provider key is configured.
      #
      # "pi-anthropic" is the realistic composition and is kept for the route inspection. It cannot
      # run a workload without ANTHROPIC_API_KEY, and Box refuses at setup when it is absent (B0104),
      # which is a finding about the profile rather than about pi.
      # Discovery, printed once so the next step is chosen from the CLI's own vocabulary rather than
      # from guesses. Three runs were spent guessing at "shell" / "@box/base" before this existed.
      - name: What Box actually offers
        run: |
          set +e
          echo "=== box run --help ==="
          box run --help 2>&1 | head -40
          echo ""
          echo "=== box profile list ==="
          box profile list 2>&1 | head -30

      - name: Create the pi profiles
        run: |
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          # --policy is explicit so the command cannot block on a prompt in a non-TTY.
          box profile create pi --with @box/pi --policy scoped
          box profile create pi-anthropic --with @box/pi,@box/anthropic --policy scoped

          # WHAT KEY SPACE A PROFILE MAY OVERRIDE, printed before trying: four runs were spent
          # guessing (agent command, then [limits.shell] command) and both were refused. The composed
          # view is the only place the answer is stated.
          echo "=== every key pi's composition exposes ==="
          box profile show pi --full 2>&1 | grep -E "^\[|^[a-z_]+ *=" | head -40

          # A shell-only profile, built from pi's, because Box ships no shell starter (measured:
          # claude, codex, kiro) and `box run <profile> -- <args>` hands the args to THAT profile's
          # agent -- so `box run pi -- node x.mjs` gave pi "node x.mjs" as a PROMPT. Two runs printed
          # nothing at all for that reason, and the reader correctly said UNCLASSIFIED both times.
          #
          # The socket question is about the mount view, not about pi, so the workload only has to
          # connect. bash needs no model.
          #
          # `command` is NOT in the profile file: it comes from the pack, and the profile's
          # [limits.shell] table is how a run's composed "command = [...]" is overridden. Rewriting
          # profile.toml found nothing to rewrite (measured: "replaced: 0", twice), which is what
          # pointed at the pack.
          mkdir -p "$HOME/.strands/box/profiles/shell"
          cp -R "$HOME/.strands/box/profiles/pi/." "$HOME/.strands/box/profiles/shell/"
          # [agent] command -- read off the composed dump above, not guessed. Three earlier attempts
          # used "agent command", then "[limits.shell] command", and Box refused both with "unknown
          # key". The composed view names the table and the key, which is why it is printed first.
          # The inherited [agent.filesystem] is pi's: exec = [node] and read of the node install.
          # bash is neither, so the shell agent would fail to execute before it could run anything --
          # which looks identical to a boundary refusal from outside. Both are granted here, and only
          # /bin, /usr/bin and the project, so this profile stays a shell profile and not wide-read.
          {
            echo "# Overrides the agent command supplied by the @box/pi pack."
            echo "[agent]"
            # -c, because box appends its args to this command: with a bare bash they became
            # bash's own argv, so "bash /bin/echo ARGS-ARRIVED" ran /bin/echo AS A SCRIPT and
            # exited 1 with no output -- which read as a boundary refusal for four runs.
            # NODE, exactly parallel to pi's own profile -- node plus args, the one shape that has
            # demonstrably worked here (pi --version printed 1.7.0). Two earlier shapes failed for
            # harness reasons unrelated to the boundary: a bare ["/bin/bash"] made the args bash's
            # argv (it ran the script PATH as a script: exit 1, no output), and ["/bin/bash", "-c"]
            # composed and launched but still exited 1 silently, with Box having DROPPED /bin from
            # both read and exec -- visible in the log as only /usr/bin and /usr/local/bin.
            echo 'command = ["/usr/local/bin/node"]'
            echo ""
            # EXACT PATHS ONLY. A directory such as /usr/bin is refused outright -- measured:
            #   strands-box: error[B0102]: `[agent]` filesystem entry "/usr/bin" is refused:
            #   grant is too broad to be authorized: /usr/bin (a system root is never a grantable tree)
            # So a shell profile cannot be built by granting a PATH prefix. This is the same
            # finding ADR-0020 records for the profile lists -- exact paths, no trees -- arriving
            # from a direction I did not expect: it blocks granting a runtime, not just a deny.
            echo "[agent.filesystem]"
            echo 'read = ["/usr/local/bin/node"]'
            echo 'write = []'
            echo 'exec = ["/usr/local/bin/node"]'
          } >> "$HOME/.strands/box/profiles/shell/profile.toml"
          echo "=== the shell profile's own additions ==="
          tail -4 "$HOME/.strands/box/profiles/shell/profile.toml"
          echo "=== and what a run of it composes ==="
          box profile show shell --full 2>&1 | grep -A3 "limits.shell" | head -6

          echo "=== the profile the measurement uses ==="
          box profile show pi --full

      # THE MEASUREMENT. `--version` is the smallest command that proves pi started: it needs node,
      # its script, and nothing else -- no model, no key, no network. If this works, the claim in the
      # pack's README is stale in fact and not only in date. If it fails, the failure names its own
      # cause, which is why the full stdout and stderr are kept rather than grepped.
      - name: Does pi start inside a box?
        id: pi
        run: |
          cd "$RUNNER_TEMP/project"
          set +e
          # Profile "pi" has no provider route, so this cannot be blocked by a missing credential.
          box run pi -- --version > "$RUNNER_TEMP/pi.out" 2> "$RUNNER_TEMP/pi.err"
          status=$?
          set -e
          echo "exit status: $status"
          echo "--- stdout ---"; cat "$RUNNER_TEMP/pi.out"
          echo "--- stderr ---"; cat "$RUNNER_TEMP/pi.err"
          echo ""
          # FOUR outcomes, not three, and the fourth is the one the first run produced. The pack
          # declares a provider route whose credential is an environment variable, so with no key set
          # Box refuses BEFORE it launches anything. Reporting that as "pi does not start" would be a
          # false finding about pi, produced by a missing secret.
          if grep -q "credential setup failed\|B0104" "$RUNNER_TEMP/pi.err" 2>/dev/null; then
            echo "VERDICT: INCONCLUSIVE -- Box refused at credential setup, before starting pi."
            echo "         Nothing is learned about pi here. Set a key or use a profile with no route."
            echo "verdict=inconclusive" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "VERDICT: pi STARTED and exited 0 -- the 'does not run on Linux' line is stale in fact."
            echo "verdict=started" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 133 ] || grep -qi "V8\|errno\|mprotect" "$RUNNER_TEMP/pi.err" 2>/dev/null; then
            echo "VERDICT: pi ABORTED on executable memory -- the pack's claim still holds."
            echo "verdict=aborted" >> "$GITHUB_OUTPUT"
          else
            echo "VERDICT: pi exited $status for an unclassified reason -- read the two files above."
            echo "verdict=other" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The shell, separately from the agent: a box that starts pi but whose Shell cannot run a command
      # is not usable, and the two are different mechanisms (agent command vs Strands Shell).
      - name: Does a shell command run inside a box?
        run: |
          cd "$RUNNER_TEMP/project"
          set +e
          box run pi -- -p "run the shell command: echo SHELL-OK > $TMPDIR/probe.txt && cat $TMPDIR/probe.txt" \
            > "$RUNNER_TEMP/shell.out" 2>&1
          echo "exit status: $?"
          tail -40 "$RUNNER_TEMP/shell.out"
          echo "(a model key is absent, so a failure here is expected and is not the question -- the"
          echo " question above is whether pi STARTS. This step is here to keep the two apart.)"
          set -e

      # Does a route replace the keychain? No key is needed: the box either accepts the route's
      # stand-in and sends it, or the profile refuses to compose. --version above proves startup;
      # this proves the credential path is wired.
      - name: Is the provider route wired?
        run: |
          cd "$RUNNER_TEMP/project"
          box profile show pi-anthropic --full | grep -A6 'egress.anthropic' || \
            echo "NOTE: no anthropic route in the composed profile"

      # The one gap the spike could not close: does a box, once it actually starts, let a workload
      # reach the host's unix sockets? The spike measured that Dogwood has no socket-shaped field for
      # net:connect, and that a rule naming one is REFUSED. What it could not measure is whether the
      # remaining control — not granting the path — is sufficient, because no box would start.
      #
      # Kept narrow on purpose: this asks ONE question, and a failure here is a finding rather than a
      # reason to distrust the pi result above.
      # The one deny with no rule-shaped counterpart, so the only one a Linux port could LOSE
      # silently. It needs a live socket, a permissive control, and a box -- which is why it belongs
      # here and not in a document.
      #
      # A refusal with no permissive run beside it is not evidence: a host that simply has no nc, or
      # no socket, produces the same "REFUSED" as a boundary that works. So both arms are measured.
      - name: Can a workload connect to a host unix socket?
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/project"
          set +e

          # A listener with NO server: the kernel accepts the connection onto the backlog, so a
          # successful connect proves reachability without needing anything to answer.
          python3 - <<'PY' &
          import socket, os, time
          p = "/tmp/box-socket-probe"
          if os.path.exists(p): os.unlink(p)
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.bind(p); s.listen(8)
          time.sleep(120)
          PY
          sleep 1
          ls -l /tmp/box-socket-probe 2>&1

          # The connect is a real script, not a python -c one-liner. The first version used
          # "import socket:socket.socket(...)", which is a SYNTAX ERROR -- so both arms printed
          # REFUSED and the control is the only reason that was visible. A probe that cannot succeed
          # reads exactly like a boundary that holds.
          cat > socket-probe.sh <<'PROBE'
          #!/bin/sh
          exec python3 "$(dirname "$0")/socket-connect.py"
          PROBE
          cat > socket-connect.py <<'PY2'
          import socket, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)
          try:
              s.connect("/tmp/box-socket-probe")
              print("CONNECTED")
          except OSError:
              print("REFUSED")
          PY2
          chmod +x socket-probe.sh
          # Prove the probe CAN say CONNECTED before trusting it to say REFUSED.
          echo "=== the probe run by hand, against its own listener ==="
          python3 ./socket-connect.py
          echo ""
          echo "=== permissive control: the host itself, with no box ==="
          control=$(sh ./socket-probe.sh)
          echo "control: $control"

          echo ""
          echo "=== DOES THE SHELL PROFILE RUN ANYTHING AT ALL? ==="
          echo "A boundary refusal and a profile that never executed look identical from outside."
          echo "-- box run shell -- --version --"
          box run shell -- --version 2>/tmp/echo.err
          echo "exit: $?"
          cat /tmp/echo.err
          echo ""
          echo "-- what that profile composes for the agent --"
          box profile show shell --full 2>&1 | sed -n "/^\[agent\]/,/^\[tool\./p" | head -22

          echo ""
          echo "=== the box: a profile whose workload does the same connect ==="
          # The FILE, not "$(cat ...)" through sh -c: the first version passed the script text, so
          # its own "$(dirname "$0")" pointed nowhere and the arm printed nothing at all -- which the
          # reader below correctly called UNCLASSIFIED rather than a finding.
          # NODE, not python3: the box's pack maps node, git, npm and pi as tools, so a bare
          # python3 is not routed and the arm printed nothing. Measured across two runs before
          # switching -- the earlier arm was silently empty rather than refused.
          cat > socket-connect.mjs <<'MJS'
          import net from "node:net";
          const s = net.connect("/tmp/box-socket-probe");
          s.setTimeout(2000);
          s.on("connect", () => { console.log("CONNECTED"); s.destroy(); });
          s.on("error", () => { console.log("REFUSED"); });
          s.on("timeout", () => { console.log("REFUSED"); s.destroy(); });
          MJS
          boxed=$(box run shell -- socket-connect.mjs 2>/tmp/socket.err)
          echo "boxed:   $boxed"
          cat /tmp/socket.err

          echo ""
          echo "=== how to read it ==="
          if [ "$control" != "CONNECTED" ]; then
            echo "INCONCLUSIVE: the control could not connect either, so the socket is not reachable"
            echo "  from this host at all. Nothing is learned about the box."
          elif [ "$boxed" = "REFUSED" ]; then
            echo "REFUSED BY THE BOX: the control connected, the box did not. The boundary holds for"
            echo "  a unix socket the box was never told about -- a kernel-view effect, not a rule."
          elif [ "$boxed" = "CONNECTED" ]; then
            echo "CONNECTED FROM INSIDE: the box allowed it. On a default-deny mount view that is the"
            echo "  finding this slice exists to report -- record it in RESULT.md rather than explain it."
          else
            echo "UNCLASSIFIED: the boxed arm produced neither answer. Read the log above."
          fi

      # "broad exec: may run any reachable binary, and load code it writes into its writable
      # grants above" -- Box's own disclosure on macOS. This asks what that MEANS: the agent
      # writes a program into its writable grant, then tries to run it.
      #
      # The distinction is real: enumerating which interpreters may run is defence in depth on top
      # of the filesystem profile. Deferring to the profile alone is a different, thinner promise.
      - name: Can the agent run a program it wrote itself?
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/project"
          set +e

          # Written into the agent's writable grant (the project), which is what "code it writes
          # into its writable grants" means. Both a shell script and a compiled-then-run path,
          # because "broad exec" could mean either that the toolchain may run, or only that the
          # shell may.
          printf '%s\n' '#!/bin/sh' 'echo WROTTEN-AND-RAN' > ./agent-wrote.sh
          chmod +x ./agent-wrote.sh
          ls -l ./agent-wrote.sh

          echo ""
          echo "=== control: the host runs it with no box ==="
          control=$(sh ./agent-wrote.sh 2>&1)
          echo "control: $control"

          echo ""
          echo "=== the pi profile: node is the only assigned interpreter here ==="
          boxed=$(box run pi -- 'cat agent-wrote.sh' 2>/tmp/wrote.err)
          echo "pi (read it back): $boxed"

          echo ""
          echo "=== a shell profile: bash was never granted anywhere ==="
          # This is the sharp arm. If the shell profile can run the script, then exec is decided by
          # the filesystem profile alone and the exec list is decorative.
          shellrun=$(box run shell -- "sh ./agent-wrote.sh" 2>/tmp/wrote-shell.err)
          echo "shell profile: $shellrun"

          echo ""
          echo "=== the whole stderr, both arms ==="
          cat /tmp/wrote.err
          cat /tmp/wrote-shell.err

          echo ""
          echo "=== how to read it ==="
          if [ "$control" != "WROTTEN-AND-RAN" ]; then
            echo "INCONCLUSIVE: the control did not run it either; nothing is learned about the box."
          elif [ "$shellrun" = "WROTTEN-AND-RAN" ]; then
            echo "RAN: a program the agent wrote executed inside the box. Exec is decided by the"
            echo "  filesystem profile, not by an exec list -- the macOS disclosure, reproduced."
          elif printf '%s' "$shellrun" | grep -qi "denied\|refus\|not permitted"; then
            echo "REFUSED: the box would not execute a program the agent wrote. Defence in depth holds."
          else
            echo "UNCLASSIFIED: neither answer. Read the stderr above."
          fi

      # The spike's remaining checks need an installed Box (three) or the upstream repository (one), so
      # they live here rather than in ci.yml. Box is installed above by the time this runs, which is the
      # whole reason the promotion is split this way.
      #
      # These are the assertions ADR-0020 rests on. A claim that only exists in a write-up is a
      # quotation; these are what make it a measurement.
      - name: The spike's Box-dependent claims still hold
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          fail=0
          for f in check-translation check-layer-distinction check-keychain-claim; do
            echo ""
            echo "=== $f ==="
            sh "spikes/platform-independence/harness/$f.sh" || fail=1
          done
          echo ""
          echo "=== verdict ==="
          if [ "$fail" -eq 0 ]; then
            echo "The spike's Box-dependent claims still hold on this Box release."
          else
            echo "A check above FAILED. ADR-0020 cites these; read the failure before the ADR."
            exit 1
          fi

      - name: Verdict
        if: always()
        run: |
          echo "=== what this run established ==="
          echo "pi step verdict:   ${{ steps.pi.outputs.verdict }}"
          echo "exit status:       ${{ steps.pi.outputs.status }}"
          echo ""
          echo "FOUR outcomes, and they are different findings:"
          echo "  started       exit 0 -- the pack's 'does not run on Linux' line is stale IN FACT"
          echo "  aborted       exit 133 / V8 / errno -- executable memory is still refused"
          echo "  inconclusive  Box refused at credential setup, so pi never ran (B0104)."
          echo "                Says NOTHING about pi. Give the profile a credential or none."
          echo "  other         an unclassified exit -- read the two files above before concluding"
          echo ""
          echo "The first run of this workflow produced 'inconclusive' and would have read as"
          echo "aborted, because a missing ANTHROPIC_API_KEY stopped Box before pi started."
          echo "That is exactly the class of error this probe exists to avoid making."
