# A Strands Box profile that loads pc-denies.dw, so the SBPL-to-Dogwood translation in this spike can
# be checked without running anything. `box profile show` validates the policy and prints the whole
# policy the run would get.
#
#   cd spikes/platform-independence/harness && box profile show .box/profile.toml --full
#
# It must live in .box/: Box refuses a project-local profile anywhere the agent can write, because the
# agent could otherwise rewrite the rules that confine it.
#
# The [filesystem] deny list is the second half of the answer. It is how Box keeps a path from EVERY
# process in the box rather than only from its own shell, and its entries must be exact paths with no
# pattern and no wildcard.
packs = []
policies = ["pc-denies.dw"]

[profile]
name = "pi-central-deny-translation"

[filesystem]
deny = [
  "${{ home }}/.ssh",
  "${{ home }}/.gitconfig",
  { path = "${{ home }}/.config/gh", optional = true },
]
deny_write = ["${{ home }}/.config/git"]

[project]
access = "write"

[agent]
command = ["bash", "--noprofile", "--norc", "-c", "echo 'the translation loaded; there is no workload to run'"]

[agent.filesystem]
read = ["${{ workspace }}"]
